services:
  crm-db:
    image: postgres:16-alpine
    container_name: crm_postgres
    restart: always
    environment:
      POSTGRES_USER: crm_admin
      POSTGRES_PASSWORD: crm_password123
      POSTGRES_DB: crm_db
    ports:
      - "5434:5432" # Ánh xạ ra ngoài cổng 5434 vì VPS đã dùng 5432, 5433
    volumes:
      - crm_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  crm-app:
    build:
      context: .
      args:
        ENABLE_HSTS: ${ENABLE_HSTS:-false}
    container_name: crm_web
    restart: always
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-5100}:3000"
    environment:
      # Kết nối tới container DB ở trên
      - DATABASE_URL=postgresql://crm_admin:crm_password123@crm-db:5432/crm_db
      - DIRECT_URL=postgresql://crm_admin:crm_password123@crm-db:5432/crm_db
      - COOKIE_SIGN_SECRET=${COOKIE_SIGN_SECRET:?COOKIE_SIGN_SECRET is required}
      - CRON_SECRET=${CRON_SECRET:?CRON_SECRET is required}
      # (Bổ sung thêm các biến ZALO_... của bạn vào đây)
    depends_on:
      crm-db:
        condition: service_healthy

  crm-cron:
    image: alpine:3.20
    container_name: crm_cron
    restart: always
    environment:
      - CRON_SECRET=${CRON_SECRET:?CRON_SECRET is required}
      - TZ=Asia/Ho_Chi_Minh
    depends_on:
      - crm-app
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache curl dcron tzdata
        printf '0 8 * * * curl --fail --silent --show-error -H "Authorization: Bearer %s" http://crm-app:3000/api/cron/zns >> /proc/1/fd/1 2>&1\n' "$$CRON_SECRET" > /etc/crontabs/root
        crond -f -l 2

volumes:
  crm_db_data:
